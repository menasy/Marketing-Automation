name: marketing-automation

services:
  api:
    build: .
    container_name: marketing_automation_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data:ro
      - ./output:/app/output:rw
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: marketing_automation_n8n
    ports:
      - "5678:5678"
    env_file:
      - .env
    environment:
      - GENERIC_TIMEZONE=Europe/Istanbul
      - TZ=Europe/Istanbul
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_BASIC_AUTH_ACTIVE=false
      - N8N_USER_MANAGEMENT_DISABLED=true
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./automation:/automation:ro
      - ./output:/output:ro
    entrypoint: /bin/sh
    command: -c "n8n import:workflow --input=/automation/workflow.json && n8n publish:workflow --id=marketing-briefing-workflow && n8n start"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  n8n_data:

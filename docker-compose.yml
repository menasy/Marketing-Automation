name: marketing-automation

services:
  api:
    build: .
    container_name: marketing_automation_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data:ro
      - ./output:/app/output:rw
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: marketing_automation_n8n
    ports:
      - "5678:5678"
    env_file:
      - .env
    environment:
      - GENERIC_TIMEZONE=Europe/Istanbul
      - TZ=Europe/Istanbul
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - N8N_BASIC_AUTH_ACTIVE=false
      - N8N_USER_MANAGEMENT_DISABLED=true
      - N8N_ADMIN_EMAIL=${N8N_ADMIN_EMAIL:-}
      - N8N_ADMIN_PASSWORD=${N8N_ADMIN_PASSWORD:-}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./automation:/automation:ro
      - ./output:/output:ro
    entrypoint: ["/bin/sh", "/automation/entrypoint-n8n.sh"]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  n8n_data:
